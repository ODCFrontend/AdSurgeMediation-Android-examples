pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // AdSurgeMediation official artifact repository (GitHub Packages).
        // Requires a GitHub token with read access; please contact the AdSurgeMediation team to obtain one.
        maven {
            name = 'AdSurgeMediationGitHubPackages'
            url  = uri('https://maven.pkg.github.com/odcfrontend/TAN_Android_Maven')
            credentials {
                username = settings.providers.gradleProperty('gpr.user').orNull
                        ?: System.getenv('GITHUB_USER')
                password = settings.providers.gradleProperty('gpr.token').orNull
                        ?: System.getenv('GITHUB_TOKEN')
            }
        }
        // Third-party ADN SDK repositories (oversea)
        maven {
            name = 'PangleOversea'
            url  = uri('https://artifact.bytedance.com/repository/pangle')
        }
        maven {
            name = 'MintegralOversea'
            url  = uri('https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea')
        }
    }
}

rootProject.name = "AdSurgeMediation-Android-Sample"
include ':app'
